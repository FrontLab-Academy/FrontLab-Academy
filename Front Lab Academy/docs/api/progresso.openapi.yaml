openapi: 3.1.0
info: { title: FrontLab Progress API, version: 0.1.0 }
paths:
  /v1/me/progress:
    get:
      summary: Consultar progresso autenticado
      responses: { '200': { description: Progresso atual }, '401': { description: Não autenticado } }
  /v1/me/progress/{moduleId}:
    put:
      summary: Criar ou atualizar progresso de módulo
      parameters: [{ in: path, name: moduleId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Progresso salvo }, '400': { description: Dados inválidos }, '401': { description: Não autenticado } }
    delete:
      summary: Remover progresso de módulo
      parameters: [{ in: path, name: moduleId, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Removido }, '401': { description: Não autenticado } }
